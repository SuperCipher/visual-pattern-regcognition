[project]
name = "visual-pattern-recognition"
version = "0.1.0"
description = "Match interior photos to HPL laminate decors"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
# Image embedding models (step 2). Install with: uv run --extra ml ...
ml = ["torch>=2.3", "transformers>=4.44", "onnxruntime>=1.18"]
# Deploys the SigLIP embedding service (modal/embed_app.py). Install with: uv run --extra modal ...
modal = ["modal>=1.0"]

[tool.uv]
package = false
