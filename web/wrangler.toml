# One Worker serves the site (dist/) and /api/surfaces. Deploy: pnpm build && wrangler deploy
name = "blackbone-decor-finder"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
run_worker_first = ["/api/*"]

[vars]
OPENROUTER_MODEL = "qwen/qwen3-vl-235b-a22b-instruct"

# 10 surface requests per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Secrets, set by Pat (never committed):
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put TURNSTILE_SECRET
